<!DOCTYPE html>
<html class="dark" lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noroff FED2 CSS-Frameworks CA</title>
    <script type="module" src="../src/app.js" defer></script>
  </head>
  <body class="dark:bg-black">
    <header class="header-layout header-layout-mobile">
      <div class="logo-div">
        <img
          class="dark:border-2 dark:border-white logo max-w-20 max-h-20 logo-size-mobile rounded-full"
          src="../Images/Logo.png"
          alt="Logo"
          style="width: 200px; height: 200px; border-radius: 50%"
        />
      </div>
      <div class="hamburger hamburger-alignment">
        <button class="hamburger hide-on-desktop" id="hamburger-menu-profile">
          <img
            class="dark:filter dark:invert min-w-7"
            src="../Images/icons8-hamburger-menu-50 copy.png"
            alt="Hamburger menu icon"
          />
        </button>
      </div>

      <div class="nav nav-col-desktop nav-alignment">
        <nav class="nav nav-col-desktop hidden space-x-4" id="nav-menu-profile">
          <ul class="nav-ul nav-layout-desktop justify-end md:justify-center">
            <li>
              <a
                class="whitespace-nowrap nav-items-desktop nav-items-mobile dark:text-white"
                href="/feed/"
                >Feed</a
              >
            </li>
            <li>
              <button
                class="dark:dark-mode-style button-mobile button-desktop px-2"
                id="logout-button"
              >
                Logout
              </button>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <button
      class="dark-mode-toggle dark:dark-mode-style button-mobile button-desktop px-2 py-2 mt-2"
    >
      Dark Mode/ Light Mode
    </button>

    <main>
      <div class="flex-center-layout">
        <h1 class="main-headers-mobile main-headers-desktop dark:text-white">
          My Profile
        </h1>
      </div>

      <div class="avatar-container flex-center-layout"></div>
      <div id="my-profile"></div>
      <div class="flex-center-layout mt-4 mb-4">
        <h2 class="post-title-desktop post-title-mobile dark:text-white">
          MY POSTS
        </h2>
      </div>
      <div class="outer-post-container" id="my-posts-container">HELLO</div>
    </main>

    <footer class="dark:border-2 dark:border-white footer">
      <div class="second-col-box-footer">
        <p class="footer-text-mobile footer-text-desktop">© 2024 Allergen 0</p>
      </div>
      <div class="third-col-box-footer">
        <ul class="footer-second-col">
          <li>
            <a class="footer-text-mobile footer-text-desktop" href="">About</a>
          </li>
          <li>
            <a class="footer-text-mobile footer-text-desktop" href=""
              >Contact</a
            >
          </li>
          <li>
            <a class="footer-text-mobile footer-text-desktop" href=""
              >Privacy Policy</a
            >
          </li>
        </ul>
      </div>
    </footer>
  </body>
</html>
